{% extends 'base/admin_base.html' %}
{% load static %}

{% block content %}
<div class="page-heading">
  <div class="page-heading-copy">
    <span class="page-icon"><i class="bi bi-person-gear"></i></span>
    <div>
      <p class="eyebrow mb-1">Customer Management</p>
      <h1 class="h3 mb-1">Edit Customer</h1>
      <p class="text-muted mb-0">Update contact and profile details for {{ customer.full_name }}.</p>
    </div>
  </div>
</div>

<section class="panel">
  <div class="panel-body">
    <form method="post" class="row g-3">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'dashboard:customers' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
