<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>{% block title %}{{ site_config.restaurant_name|default:'YUMMY Restaurant' }}{% endblock %}</title>
  <meta name="description" content="Order delicious meals online from {{ site_config.restaurant_name|default:'YUMMY Restaurant' }}.">
  <meta name="keywords" content="restaurant, online ordering, food delivery, YUMMI, meals">
  <link href="{% static 'public/img/favicon.svg' %}" rel="icon" type="image/svg+xml">
  <link href="{% static 'public/img/favicon.png' %}" rel="icon" type="image/png">
  <link href="{% static 'public/img/apple-touch-icon.png' %}" rel="apple-touch-icon">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}

  {% block extra_js %}{% endblock %}
</body>
</html>
