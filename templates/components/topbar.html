{% load static %}
<nav class="navbar admin-navbar navbar-expand bg-white">
  <div class="container-fluid px-3 px-lg-4">
    <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-controls="adminSidebar" aria-expanded="true" aria-label="Toggle sidebar"><span></span><span></span><span></span></button>
    <div class="navbar-actions ms-auto">
      <a href="{% url 'menu:home' %}" class="btn btn-outline-secondary btn-sm me-2" target="_blank" title="View public site"><i class="bi bi-box-arrow-up-right"></i> View Site</a>
      <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme"><i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i></button>
      <div class="dropdown">
        <button class="icon-button" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Notifications">
          <span class="notification-dot"></span><i class="bi bi-bell" aria-hidden="true"></i>
        </button>
        <div class="dropdown-menu dropdown-menu-end notification-menu">
          <div class="dropdown-header fw-bold text-body">Notifications</div>
          <a class="dropdown-item" href="{% url 'dashboard:orders' %}"><span class="notification-title">Orders pending</span><span class="notification-time">Active</span></a>
          <a class="dropdown-item" href="{% url 'dashboard:payments' %}"><span class="notification-title">Pending payments</span><span class="notification-time">Active</span></a>
        </div>
      </div>
      <div class="dropdown">
        <button class="profile-button dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          {% if site_config.admin_avatar %}
            <img class="avatar-img avatar-sm" src="{{ site_config.admin_avatar.url }}" alt="{{ user.username }}">
          {% else %}
            <span class="avatar-img avatar-sm initial-avatar" aria-hidden="true">{{ user.username|slice:":1"|upper }}</span>
          {% endif %}
          <span class="profile-name d-none d-sm-inline">{{ user.username }}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="{% url 'auth:logout' %}" onclick="return confirm('Are you sure you want to sign out?');">Sign out</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>
