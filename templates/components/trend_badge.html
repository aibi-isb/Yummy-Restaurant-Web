{% if value > 0 %}
  <span class="stat-trend up"><i class="bi bi-arrow-up-short"></i> {{ value }}%</span>
{% elif value < 0 %}
  <span class="stat-trend down"><i class="bi bi-arrow-down-short"></i> {{ value|cut:"-" }}%</span>
{% else %}
  <span class="stat-trend neutral"><i class="bi bi-dash"></i> 0%</span>
{% endif %}
